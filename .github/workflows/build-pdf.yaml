name: Build PDF

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number whose preview release/tag should be cleaned up"
        required: true
        type: string

concurrency:
  group: build-pdf-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write

    env:
      PR_COMMENT_MARKER: <!-- pdf-preview-comment -->
      RELEASE_TAG: ${{ github.event_name == 'push' && 'latest' || format('pr-{0}', github.event.pull_request.number) }}
      REPO_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Compute Dockerfile hash
        id: docker-hash
        run: |
          HASH=$(sha256sum Dockerfile | cut -c1-12)
          IMAGE="ghcr.io/nulp-hc-lab/thesis-builder:df-${HASH}"
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Dockerfile hash: ${HASH}"
          echo "Content-addressed image: ${IMAGE}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Try to pull cached image
        id: cache-check
        env:
          IMAGE: ${{ steps.docker-hash.outputs.image }}
        run: |
          if docker pull "$IMAGE" 2>/dev/null; then
            docker tag "$IMAGE" thesis-builder
            echo "cached=true" >> "$GITHUB_OUTPUT"
            echo "✓ Reused cached image $IMAGE"
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
            echo "No cached image for this Dockerfile hash; will build."
          fi

      - name: Enable containerd image store
        if: steps.cache-check.outputs.cached != 'true'
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'

      - name: Set up Docker Buildx
        if: steps.cache-check.outputs.cached != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.cache-check.outputs.cached != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: true
          tags: ${{ steps.docker-hash.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag built image as thesis-builder
        if: steps.cache-check.outputs.cached != 'true'
        env:
          IMAGE: ${{ steps.docker-hash.outputs.image }}
        run: docker tag "$IMAGE" thesis-builder

      - name: Compile LaTeX
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/opt/code" \
            -w /opt/code \
            thesis-builder \
            make build

      - name: Verify PDFs were produced
        run: |
          test -f build/main.pdf || { echo "ERROR: main.pdf not found in build/"; exit 1; }

      - name: Rename PDFs
        run: |
          mv build/main.pdf "build/${REPO_NAME}.pdf"

      - name: Create or update release with PDFs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Rolling release: recreate so the tag points at the merged commit.
            gh release delete "$RELEASE_TAG" --repo "${{ github.repository }}" --cleanup-tag -y 2>/dev/null || true
            gh release create "$RELEASE_TAG" \
              "build/${REPO_NAME}.pdf" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "Latest build (main)" \
              --notes "Auto-generated PDF for ${{ github.sha }}." \
              --latest
          elif gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "build/${REPO_NAME}.pdf" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "build/${REPO_NAME}.pdf" \
              --repo "${{ github.repository }}" \
              --target "${{ github.event.pull_request.head.sha }}" \
              --title "PR #${{ github.event.pull_request.number }} — PDF preview" \
              --notes "Auto-generated PDF for PR #${{ github.event.pull_request.number }}." \
              --prerelease
          fi

      - name: Find existing PR comment
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: ${{ env.PR_COMMENT_MARKER }}

      - name: Build comment footer
        if: always() && github.event_name == 'pull_request'
        id: footer
        run: |
          TS=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          echo "text=_Last updated: ${TS} (commit ${{ github.event.pull_request.head.sha }})_" >> "$GITHUB_OUTPUT"

      - name: Comment on PR (success)
        if: success() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ${{ env.PR_COMMENT_MARKER }}
            **PDF build succeeded.**
            - [Thesis (${{ env.REPO_NAME }}.pdf)](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${{ env.REPO_NAME }}.pdf)

            ${{ steps.footer.outputs.text }}

      - name: Comment on PR (failure)
        if: failure() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ${{ env.PR_COMMENT_MARKER }}
            **PDF build failed.** Check the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

            ${{ steps.footer.outputs.text }}

  cleanup:
    name: Cleanup PDF release
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
    steps:
      - name: Delete preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="pr-${PR_NUMBER}"
          gh release delete "$TAG" --repo "${{ github.repository }}" 2>/dev/null || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG" 2>/dev/null || true
